global
    log stdout format raw local0 info
    maxconn 4096

defaults
    log global
    mode http
    option httplog
    option dontlognull
    timeout connect 3s
    timeout client 30s
    timeout server 30s
    timeout http-request 10s

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s

frontend shinmon_https_listener_pool
    bind :4300-4399 ssl crt /etc/shinmon/tls/edge.pem ssl-min-ver TLSv1.2
    http-request del-header X-Gateway-Listener-Port
    http-request set-header X-Gateway-Listener-Port %[dst_port]
    http-request set-header X-Forwarded-Proto https
    default_backend shinmon_gateways

backend shinmon_gateways
    balance roundrobin
    option httpchk
    http-check send meth GET uri /health/ready hdr Host gateway-health
    http-check expect status 200
    default-server check inter 2s fastinter 500ms downinter 500ms fall 2 rise 2
    server-template gateway 1-8 gateway:4040 resolvers docker init-addr libc,none ssl verify required ca-file /etc/shinmon/tls/internal-ca.pem sni str(gateway) verifyhost gateway
