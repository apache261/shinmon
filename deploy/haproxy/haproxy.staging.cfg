global
    log stdout format raw local0 info
    maxconn 4096

defaults
    log global
    mode http
    option httplog
    option dontlognull
    timeout connect 3s
    timeout client 30s
    timeout server 30s
    timeout http-request 10s

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s

frontend shinmon_listener_pool
    bind :4200-4299
    http-request del-header X-Gateway-Listener-Port
    http-request set-header X-Gateway-Listener-Port %[dst_port]
    default_backend shinmon_gateways

backend shinmon_gateways
    balance roundrobin
    option httpchk
    http-check send meth GET uri /health/ready hdr Host gateway-health
    http-check expect status 200
    default-server check inter 2s fastinter 500ms downinter 500ms fall 2 rise 2
    server gateway-1 gateway-1:4040 resolvers docker init-addr libc,none
    server gateway-2 gateway-2:4040 resolvers docker init-addr libc,none
