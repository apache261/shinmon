<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title description">
  <title id="title">Shinmon logo</title>
  <desc id="description">A gateway containing an S-shaped route.</desc>
  <defs>
    <linearGradient id="background" x1="16" y1="12" x2="112" y2="116" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10263a"/>
      <stop offset="1" stop-color="#06101c"/>
    </linearGradient>
    <linearGradient id="gateway" x1="24" y1="24" x2="104" y2="104" gradientUnits="userSpaceOnUse">
      <stop stop-color="#43e6a0"/>
      <stop offset="1" stop-color="#38a8ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#background)" stroke="#25445f" stroke-width="4"/>
  <g fill="none" stroke="url(#gateway)" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M25 34h78" stroke-width="10"/>
    <path d="M35 52V99M93 52V99" stroke-width="9"/>
    <path d="M27 48h74" stroke-width="5" opacity=".72"/>
  </g>
  <path d="M78 56c-5-5-10-7-16-7-9 0-16 5-16 12 0 8 7 10 18 12 11 2 17 5 17 13 0 8-8 14-18 14-7 0-14-3-19-8" fill="none" stroke="#f5fbff" stroke-width="8" stroke-linecap="round"/>
  <circle cx="44" cy="92" r="4" fill="#43e6a0"/>
  <circle cx="78" cy="56" r="4" fill="#38a8ff"/>
</svg>
